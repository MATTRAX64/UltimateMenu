name: Issues Cleaner
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
  issues: write
concurrency: issues-cleaner
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/clean_issues.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPORTER_LOGIN: ${{ vars.REPORTER_LOGIN }}
          APPLY: ${{ vars.ISSUE_CLEANER_APPLY }}
